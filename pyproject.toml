[project]
name = "switchbot-py"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "gsy0911", email = "yoshiki0911@gmail.com" }
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]
readme = "README.md"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "jupyterlab>=4.6.4",
    "ruff>=0.17.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/switchbot_py"]

[tool.pytest.ini_options]
addopts = [
    "-vv",
    "--ignore=.venv",
    "--ignore=node_modules",
    "--ignore=volume",
    "--cov=./src/switchbot_py",
    "--cov-report=html",
]
markers = []
pythonpath = [
    "./src/switchbot_py"
]
testpaths = [
    "./test",
]
